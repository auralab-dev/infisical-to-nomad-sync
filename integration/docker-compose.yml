services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  infisical:
    # Override INFISICAL_IMAGE in CI with a pinned release or digest.
    image: ${INFISICAL_IMAGE:-infisical/infisical:latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgres://infisical:infisical@postgres:5432/infisical?sslmode=disable
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: 4bnfe4e407b8921c104518903515b218
      AUTH_SECRET: integration-test-auth-secret
      SITE_URL: http://localhost:18080
      TELEMETRY_ENABLED: "false"
      LICENSE_KEY: ${LICENSE_KEY:-}
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60

  nomad:
    # Nomad's client creates cgroups for allocations. This is intentionally
    # limited to the disposable integration environment.
    privileged: true
    cgroup: host
    build:
      context: ..
      dockerfile: integration/Dockerfile.nomad
      args:
        NOMAD_VERSION: ${NOMAD_VERSION:-2.0.4}
    command:
      - agent
      - -dev
      - -acl-enabled
      - -bind=0.0.0.0
      - -config=/etc/nomad.d
    ports:
      - "14646:4646"
    volumes:
      - ..:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4646/v1/status/leader"]
      interval: 2s
      timeout: 5s
      retries: 30
